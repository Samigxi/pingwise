<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="pingwise-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Central node -->
  <circle cx="24" cy="24" r="6" fill="url(#pingwise-grad)" filter="url(#glow)"/>
  <!-- Orbiting nodes -->
  <circle cx="10" cy="12" r="3.5" fill="#00f0ff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="38" cy="12" r="3.5" fill="#00f0ff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="8" cy="34" r="3.5" fill="#a855f7" opacity="0.9" filter="url(#glow)"/>
  <circle cx="40" cy="34" r="3.5" fill="#a855f7" opacity="0.9" filter="url(#glow)"/>
  <circle cx="24" cy="6" r="2.5" fill="#10b981" opacity="0.8" filter="url(#glow)"/>
  <circle cx="24" cy="42" r="2.5" fill="#10b981" opacity="0.8" filter="url(#glow)"/>
  <!-- Connection lines -->
  <line x1="24" y1="24" x2="10" y2="12" stroke="#00f0ff" stroke-width="1" opacity="0.4"/>
  <line x1="24" y1="24" x2="38" y2="12" stroke="#00f0ff" stroke-width="1" opacity="0.4"/>
  <line x1="24" y1="24" x2="8" y2="34" stroke="#a855f7" stroke-width="1" opacity="0.4"/>
  <line x1="24" y1="24" x2="40" y2="34" stroke="#a855f7" stroke-width="1" opacity="0.4"/>
  <line x1="24" y1="24" x2="24" y2="6" stroke="#10b981" stroke-width="1" opacity="0.4"/>
  <line x1="24" y1="24" x2="24" y2="42" stroke="#10b981" stroke-width="1" opacity="0.4"/>
  <!-- Cross connections -->
  <line x1="10" y1="12" x2="38" y2="12" stroke="#00f0ff" stroke-width="0.7" opacity="0.2"/>
  <line x1="8" y1="34" x2="40" y2="34" stroke="#a855f7" stroke-width="0.7" opacity="0.2"/>
  <line x1="10" y1="12" x2="8" y2="34" stroke="#64748b" stroke-width="0.7" opacity="0.2"/>
  <line x1="38" y1="12" x2="40" y2="34" stroke="#64748b" stroke-width="0.7" opacity="0.2"/>
</svg>
